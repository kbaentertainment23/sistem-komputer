                        </div>
                    </div>

                    ${labChallengeTarget !== null ? `
                        <div class="bg-gradient-to-r from-amber-500 to-orange-500 text-white p-6 rounded-3xl shadow-lg flex flex-col sm:flex-row items-center justify-between gap-4">
                            <div>
                                <span class="text-xs font-black uppercase tracking-wider bg-black/20 px-3 py-1 rounded-full">Tantangan Tebak Angka</span>
                                <h3 class="text-base sm:text-lg font-black mt-1.5">Berapakah nilai desimal dari susunan lampu biner di bawah?</h3>
                                <p class="text-xs text-amber-100 font-medium">Hitung jumlah nilai tempat yang bernilai 1!</p>
                            </div>
                            <div class="flex items-center gap-2.5 w-full sm:w-auto">
                                <input type="number" id="lab-guess-input" placeholder="Tebak..." class="w-32 px-4 py-3 rounded-2xl text-navy-900 font-mono font-bold text-center focus:outline-none shadow-inner">
                                <button onclick="checkLabGuess()" class="px-5 py-3 rounded-2xl bg-navy-900 hover:bg-navy-800 text-cyan-300 text-xs font-extrabold transition">Cek</button>
                                <button onclick="cancelLabChallenge()" class="px-4 py-3 rounded-2xl bg-white/20 hover:bg-white/30 text-white text-xs font-bold transition"><i class="fa-solid fa-xmark text-sm"></i></button>
                            </div>
                        </div>
                    ` : ''}

                    <div class="bg-white p-7 rounded-3xl border border-slate-200/80 shadow-sm">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                            <div>
                                <h2 class="text-xl font-black text-navy-900">Panel Bit Interaktif (${labBitWidth} Kolom)</h2>
                                <p class="text-xs text-slate-500 font-medium">Klik tombol <strong>0 / 1</strong> pada setiap kolom atau ketik langsung bilangan biner.</p>
                            </div>
                            <div class="flex items-center gap-3">
                                <label class="text-xs font-extrabold text-slate-700">Input Biner:</label>
                                <input type="text" id="lab-bin-text" value="${binaryStr}" maxlength="${labBitWidth}" placeholder="Contoh: 1011" 
                                    oninput="handleLabBinInput(this.value)"
                                    class="w-44 px-4 py-2.5 rounded-2xl border-2 border-slate-300 focus:border-electric-500 font-mono font-bold text-center text-navy-900 text-base tracking-wider focus:outline-none shadow-xs">
                            </div>
                        </div>
                        <div id="lab-bin-error" class="hidden mb-4 p-3.5 rounded-2xl bg-red-50 border border-red-200 text-red-700 text-xs font-bold flex items-center gap-2.5">
                            <i class="fa-solid fa-triangle-exclamation text-base"></i>
                            <span>Input tidak valid! Bilangan biner hanya menerima angka <strong>0</strong> dan <strong>1</strong>.</span>
                        </div>

                        <div class="grid grid-cols-4 sm:grid-cols-8 gap-3">
                            ${weights.map((w, idx) => {
                                const bit = labBits[idx];
                                const pos = (labBitWidth - 1) - idx;
                                return `
                                    <div class="rounded-2xl border-2 p-3 text-center transition-all ${bit === 1 ? 'bg-blue-50/90 border-electric-500 shadow-md shadow-blue-500/10' : 'bg-slate-50 border-slate-200'}">
                                        <div class="text-[10px] font-mono text-slate-400 font-bold">2<sup>${pos}</sup></div>
                                        <div class="font-mono font-black text-xs sm:text-sm my-1.5 ${bit === 1 ? 'text-electric-600' : 'text-slate-500'}">${w}</div>
                                        <button onclick="toggleLabBit(${idx})" class="bit-switch w-full py-2.5 my-1 rounded-xl font-mono font-black text-base sm:text-lg transition ${bit === 1 ? 'bg-electric-500 text-white shadow-md shadow-blue-500/30' : 'bg-white border border-slate-300 text-slate-600 hover:bg-slate-100'}">
                                            ${bit}
                                        </button>
                                        <div class="text-[10px] font-mono font-bold ${bit === 1 ? 'text-navy-900' : 'text-slate-400'}">
                                            ${bit === 1 ? `+${w}` : '0'}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    ${labChallengeTarget !== null ? `
                        <div class="bg-navy-900 text-cyan-300 p-6 rounded-3xl text-center text-xs sm:text-sm font-bold border border-slate-800 shadow-md">
                            <i class="fa-solid fa-eye-slash mr-2 text-base"></i> Kunci hasil konversi disembunyikan sementara selama Mode Tantang Saya berlangsung!
                        </div>
                    ` : `
                    <div class="grid lg:grid-cols-12 gap-6">
                        <div class="lg:col-span-8 bg-white p-7 rounded-3xl border border-slate-200/80 shadow-sm space-y-4">
                            <h3 class="font-extrabold text-navy-900 text-base flex items-center gap-2.5">
                                <i class="fa-solid fa-calculator text-electric-500 text-lg"></i>
                                Proses Perhitungan Otomatis
                            </h3>
                            <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200/80 font-mono text-xs sm:text-sm space-y-2.5 overflow-x-auto shadow-inner">
                                <div class="text-slate-500 font-semibold">1. Perkalian setiap digit dengan nilai tempat:</div>
                                <div class="text-navy-900 leading-relaxed font-bold">
                                    ${weights.map((w, i) => `<span class="${labBits[i]===1 ? 'text-electric-600 font-black' : 'text-slate-400'}">(${labBits[i]}&times;${w})</span>`).join(' + ')}
                                </div>
                                <div class="text-slate-500 pt-2 font-semibold">2. Penjumlahan kolom aktif (bernilai 1):</div>
                                <div class="text-navy-900 font-black text-base">
                                    ${activeTerms.length > 0 ? activeTerms.join(' + ') : '0'} = <span class="text-electric-600">${totalDecimal}</span>
                                </div>
                            </div>
                        </div>

                        <div class="lg:col-span-4 bg-gradient-to-br from-navy-900 to-indigo-950 text-white p-7 rounded-3xl shadow-xl flex flex-col justify-center items-center text-center border border-slate-800">
                            <span class="text-xs font-mono uppercase tracking-wider text-cyan-400 font-bold">Hasil Konversi Desimal</span>
                            <div class="text-4xl sm:text-5xl font-mono font-black my-3.5 text-white">${totalDecimal}<sub class="text-lg text-cyan-400">10</sub></div>
                            <div class="text-xs font-mono text-slate-300 bg-navy-950 px-4 py-2 rounded-xl border border-slate-800 break-all">
                                Biner: ${binaryStr}<sub>2</sub>
                            </div>
                        </div>
                    </div>
                    `}
                </div>
            `;
        }

        function setLabBitWidth(width) {
            labBitWidth = width;
            labChallengeTarget = null;
            labBits = Array(width).fill(0);
            if (width === 8) labBits = [0, 0, 1, 0, 1, 1, 0, 1];
            renderLabBinToDec();
        }

        function startLabRandomChallenge() {
            const maxVal = labBitWidth === 8 ? 255 : 2048;
            const randomNum = Math.floor(Math.random() * (maxVal - 1)) + 1;
            labChallengeTarget = randomNum;
            const binStr = randomNum.toString(2).padStart(labBitWidth, '0');
            labBits = binStr.split('').map(Number);
            playTone('switch');
            renderLabBinToDec();
        }

        function checkLabGuess() {
            const guessEl = document.getElementById('lab-guess-input');
            const guess = parseInt(guessEl.value, 10);
            if (isNaN(guess)) {
                showToast('Masukkan angka desimal tebakanmu terlebih dahulu!', 'error');
                return;
            }
            if (guess === labChallengeTarget) {
                const solved = labChallengeTarget;
                labChallengeTarget = null;
                addXP(15, `Tebakan Lab Konversi (${solved}) tepat sekali!`);
                renderLabBinToDec();
            } else {
                playTone('wrong');
                showToast(`Tebakan ${guess} masih belum tepat. Coba hitung lagi!`, 'error');
            }
        }

        function cancelLabChallenge() {
            labChallengeTarget = null;
            renderLabBinToDec();
        }

        function toggleLabBit(idx) {
            playTone('switch');
            labBits[idx] = labBits[idx] === 1 ? 0 : 1;
            renderLabBinToDec();
        }

        function resetLabBits() {
            labChallengeTarget = null;
            labBits = Array(labBitWidth).fill(0);
            renderLabBinToDec();
        }

        function handleLabBinInput(raw) {
            const errBox = document.getElementById('lab-bin-error');
            if (raw === '') {
                errBox.classList.add('hidden');
                labBits = Array(labBitWidth).fill(0);
                renderLabBinToDec();
                return;
            }
            if (!/^[01]+$/.test(raw)) {
                errBox.classList.remove('hidden');
                return;
            }
            errBox.classList.add('hidden');
            const padded = raw.padStart(labBitWidth, '0');
            labBits = padded.split('').map(Number);
            renderLabBinToDec();
        }

        function generateDecToBinSteps(num) {
            if (num === 0) return [{ step: 1, dividend: 0, quotient: 0, remainder: 0 }];
            const steps = [];
            let current = num;
            let count = 1;
            while (current > 0) {
                const quotient = Math.floor(current / 2);
                const remainder = current % 2;
                steps.push({ step: count++, dividend: current, quotient, remainder });
                current = quotient;
            }
            return steps;
        }

        function renderLabDecToBin() {
            labDecSteps = generateDecToBinSteps(labDecInput);
            if (labDecVisibleStep === 0 || labDecVisibleStep > labDecSteps.length) labDecVisibleStep = labDecSteps.length;
            drawLabDecToBinUI();
        }

        function drawLabDecToBinUI() {
            const ws = document.getElementById('lab-workspace');
            if (!ws) return;

            const fullBinary = labDecSteps.map(s => s.remainder).reverse().join('');
            const visibleSteps = labDecSteps.slice(0, labDecVisibleStep);
            const isComplete = labDecVisibleStep === labDecSteps.length;

            ws.innerHTML = `
                <div class="space-y-6 fade-in">
                    <div class="bg-white p-7 rounded-3xl border border-slate-200/80 shadow-sm">
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div>
                                <h2 class="text-xl font-black text-navy-900">Simulator Pembagian Berulang dengan 2</h2>
                                <p class="text-xs text-slate-500 font-medium">Masukkan bilangan bulat desimal nonnegatif untuk melihat proses pembagiannya.</p>
                            </div>
                            <div class="flex items-center gap-3">
                                <input type="text" id="lab-dec-input" value="${labDecInput}" placeholder="Contoh: 45"
                                    class="w-36 px-4 py-3 rounded-2xl border-2 border-cyan-500 font-mono font-bold text-center text-navy-900 text-lg focus:outline-none shadow-xs">
                                <button onclick="submitLabDecInput()" class="px-6 py-3.5 rounded-2xl bg-electric-500 hover:bg-electric-600 text-white text-xs sm:text-sm font-bold shadow-md transition">
                                    Hitung Proses
                                </button>
                            </div>
                        </div>
                        <div id="lab-dec-error" class="hidden mt-4 p-3.5 rounded-2xl bg-red-50 border border-red-200 text-red-700 text-xs font-bold flex items-center gap-2.5">
                            <i class="fa-solid fa-triangle-exclamation text-base"></i>
                            <span id="lab-dec-error-msg">Input tidak valid!</span>
                        </div>
                    </div>

                    <div class="grid lg:grid-cols-12 gap-6">
                        <div class="lg:col-span-8 bg-white p-7 rounded-3xl border border-slate-200/80 shadow-sm">
                            <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
                                <span class="text-xs font-extrabold uppercase tracking-wider text-slate-500">Tabel Pembagian Bertahap</span>
                                <div class="flex gap-2">
                                    <button onclick="stepLabDec('reset')" class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold transition">Mulai</button>
                                    <button onclick="stepLabDec('next')" ${isComplete ? 'disabled' : ''} class="px-3.5 py-2 rounded-xl bg-electric-500 disabled:opacity-40 hover:bg-electric-600 text-white text-xs font-bold transition shadow-xs">Berikutnya</button>
                                    <button onclick="stepLabDec('all')" class="px-3.5 py-2 rounded-xl bg-navy-900 hover:bg-navy-800 text-cyan-400 text-xs font-bold transition">Semua</button>
                                </div>
                            </div>

                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse font-mono text-sm rounded-2xl overflow-hidden shadow-xs">
                                    <thead>
                                        <tr class="bg-navy-900 text-white">
                                            <th class="p-3.5">Tahap</th>
                                            <th class="p-3.5">Pembagian</th>
                                            <th class="p-3.5">Hasil Bagi</th>
                                            <th class="p-3.5 text-cyan-400">Sisa (Bit)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${visibleSteps.map((s, idx) => `
                                            <tr class="border-b border-slate-200 ${idx === visibleSteps.length - 1 ? 'bg-cyan-50/90 font-bold' : ''}">
                                                <td class="p-3.5 text-slate-400">#${s.step}</td>
                                                <td class="p-3.5 text-navy-900">${s.dividend} &divide; 2</td>
                                                <td class="p-3.5 text-slate-700">${s.quotient}</td>
                                                <td class="p-3.5">
                                                    <span class="inline-flex items-center justify-center w-8 h-8 rounded-xl bg-navy-900 text-cyan-400 font-black">${s.remainder}</span>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <div class="lg:col-span-4 bg-gradient-to-br from-navy-900 to-indigo-950 text-white p-7 rounded-3xl shadow-xl flex flex-col justify-between border border-slate-800">
                            <div>
                                <span class="text-xs font-mono uppercase tracking-wider text-cyan-400 font-bold">Pembentukan Biner</span>
                                <p class="text-xs text-slate-300 mt-1 font-medium">Sisa pembagian disusun dari bawah ke atas:</p>
                            </div>
                            
                            <div class="my-6 text-center">
                                <div class="inline-flex flex-wrap justify-center gap-2 font-mono">
                                    ${visibleSteps.map(s => s.remainder).reverse().map(bit => `
                                        <span class="w-10 h-12 rounded-2xl bg-cyan-400 text-navy-950 font-black text-xl flex items-center justify-center shadow-md">${bit}</span>
                                    `).join('')}
                                </div>
                                <div class="mt-4 text-xs font-mono text-cyan-300 font-bold">
                                    ${isComplete ? `Hasil: ${labDecInput}₁₀ = ${fullBinary}₂` : `Tahap ${labDecVisibleStep} dari ${labDecSteps.length}...`}
                                </div>
                            </div>

                            <div class="bg-navy-950 p-4 rounded-2xl border border-slate-800 text-xs text-slate-300 font-medium">
                                <i class="fa-solid fa-arrow-up text-cyan-400 mr-1.5"></i> Bit paling kiri berasal dari sisa pembagian terakhir.
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function submitLabDecInput() {
            const raw = document.getElementById('lab-dec-input').value.trim();
            const errBox = document.getElementById('lab-dec-error');
            const errMsg = document.getElementById('lab-dec-error-msg');

            if (!/^\d+$/.test(raw)) {
                errMsg.textContent = 'Masukkan bilangan bulat nonnegatif (contoh: 25, 45, 128).';
                errBox.classList.remove('hidden');
                return;
            }
            const num = parseInt(raw, 10);
            if (num > 1000000) {
                errMsg.textContent = 'Angka terlalu besar! Maksimal 1.000.000.';
                errBox.classList.remove('hidden');
                return;
            }
            errBox.classList.add('hidden');
            labDecInput = num;
            labDecSteps = generateDecToBinSteps(num);
            labDecVisibleStep = 1;
            drawLabDecToBinUI();
        }

        function stepLabDec(action) {
            if (action === 'reset') labDecVisibleStep = 1;
            else if (action === 'next' && labDecVisibleStep < labDecSteps.length) labDecVisibleStep++;
            else if (action === 'all') labDecVisibleStep = labDecSteps.length;
            drawLabDecToBinUI();
        }

        // ==========================================
        // 8. LATIHAN SOAL
        // ==========================================
        let activeQuizSession = null;

        function shuffleArray(arr) {
            const copy = [...arr];
            for (let i = copy.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [copy[i], copy[j]] = [copy[j], copy[i]];
            }
            return copy;
        }

        function renderLatihan(container, levelToStart = null) {
            if (levelToStart) {
                startQuizLevel(levelToStart);
                return;
            }

            const levels = [
                { lvl: 1, name: 'Level 1 – Pemula', tag: 'Dasar Konsep', desc: 'Pengertian biner, desimal, simbol angka, dan nilai tempat sederhana.', color: 'from-blue-500 to-cyan-500', icon: 'fa-seedling' },
                { lvl: 2, name: 'Level 2 – Menengah', tag: 'Keterampilan Konversi', desc: 'Latihan konversi biner ke desimal, desimal ke biner, dan nilai tempat.', color: 'from-indigo-500 to-blue-600', icon: 'fa-bolt' },
                { lvl: 3, name: 'Level 3 – Tantangan', tag: 'Analisis Soal', desc: 'Konversi angka lebih besar, analisis kesalahan, dan studi kasus.', color: 'from-purple-600 to-indigo-700', icon: 'fa-fire-flame-curved' }
            ];

            container.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-white p-7 rounded-3xl border border-slate-200/80 shadow-sm">
                        <h1 class="text-3xl font-black text-navy-900">Latihan Interaktif Bertingkat</h1>
                        <p class="text-sm text-slate-600 mt-2 font-medium">Pilih tingkat kesulitan latihan di bawah ini. Soal dan pilihan jawaban diacak setiap kali kamu berlatih!</p>
                    </div>

                    <div class="grid md:grid-cols-3 gap-6">
                        ${levels.map(l => {
                            const bestScore = appState.quizScores[l.lvl];
                            const passed = bestScore !== null && bestScore >= 60;
                            return `
                                <div class="bg-white rounded-3xl border border-slate-200/80 shadow-sm overflow-hidden flex flex-col justify-between hover:shadow-xl transition interactive-card">
                                    <div>
                                        <div class="bg-gradient-to-r ${l.color} p-6 text-white flex items-center justify-between">
                                            <div>
                                                <span class="text-[11px] font-black uppercase tracking-wider bg-white/20 px-3 py-1 rounded-full">${l.tag}</span>
                                                <h3 class="text-xl font-extrabold mt-2.5">${l.name}</h3>
                                            </div>
                                            <i class="fa-solid ${l.icon} text-3xl opacity-90"></i>
                                        </div>
                                        <div class="p-6">
                                            <p class="text-xs sm:text-sm text-slate-600 leading-relaxed mb-5 font-medium">${l.desc}</p>
                                            <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-100 flex items-center justify-between text-xs">
                                                <span class="text-slate-500 font-semibold">Skor Tertinggi:</span>
                                                <span class="font-mono font-black ${passed ? 'text-emerald-600' : 'text-navy-900'} text-sm">
                                                    ${bestScore !== null ? bestScore + ' / 100' : 'Belum'}
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="p-6 pt-0">
                                        <button onclick="startQuizLevel(${l.lvl})" class="w-full py-3.5 rounded-2xl bg-navy-900 hover:bg-electric-500 text-white font-extrabold text-sm transition shadow-md">
                                            ${bestScore !== null ? 'Latihan Lagi' : 'Mulai Latihan'} <i class="fa-solid fa-play ml-1.5"></i>
                                        </button>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function startQuizLevel(lvl) {
            const rawQuestions = practiceBank[lvl];
            const prepared = shuffleArray(rawQuestions).map(item => ({
                ...item,
                shuffledOptions: shuffleArray(item.options)
            }));

            activeQuizSession = {
                level: lvl,
                questions: prepared,
                currentIndex: 0,
                correctCount: 0,
                selectedAnswer: null,
                isAnswered: false
            };
            renderQuizQuestion();
        }

        function renderQuizQuestion() {
            const container = document.getElementById('app-content');
            const qSession = activeQuizSession;
            const currentQ = qSession.questions[qSession.currentIndex];
            const total = qSession.questions.length;

            container.innerHTML = `
                <div class="max-w-3xl mx-auto space-y-6 fade-in">
                    <div class="bg-white p-5 rounded-3xl border border-slate-200/80 shadow-sm flex items-center justify-between">
                        <button onclick="renderLatihan(document.getElementById('app-content'))" class="text-xs font-bold text-slate-500 hover:text-navy-900 flex items-center gap-2">
                            <i class="fa-solid fa-arrow-left"></i> Kembali ke Pilih Level
                        </button>
                        <div class="font-mono text-xs font-bold bg-blue-50 text-electric-600 px-3.5 py-1.5 rounded-xl shadow-inner">
                            Level ${qSession.level} &bull; Soal ${qSession.currentIndex + 1} / ${total}
                        </div>
                    </div>

                    <div class="bg-white p-7 sm:p-9 rounded-3xl border border-slate-200/80 shadow-sm space-y-6">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold text-slate-400">Pintasan Keyboard: Gunakan tombol <strong>A, B, C, D</strong> dan <strong>Enter</strong></span>
                        </div>
                        <h2 class="text-xl sm:text-2xl font-black text-navy-900 leading-relaxed">${currentQ.q}</h2>

                        <div class="space-y-3.5">
                            ${currentQ.shuffledOptions.map((opt, idx) => {
                                const letters = ['A', 'B', 'C', 'D'];
                                let btnStyle = 'bg-slate-50 hover:bg-blue-50/70 border-slate-200 text-navy-900';
                                let badgeStyle = 'bg-white border-slate-300 text-slate-600';

                                if (qSession.isAnswered) {
                                    if (opt === currentQ.answer) {
                                        btnStyle = 'bg-emerald-50 border-emerald-500 text-emerald-950 font-bold';
                                        badgeStyle = 'bg-emerald-500 border-emerald-500 text-white';
                                    } else if (opt === qSession.selectedAnswer) {
                                        btnStyle = 'bg-red-50 border-red-500 text-red-950';
                                        badgeStyle = 'bg-red-500 border-red-500 text-white';
                                    } else {
                                        btnStyle = 'bg-slate-50 border-slate-200 text-slate-400 opacity-60';
                                    }
                                }

                                return `
                                    <button onclick="submitQuizAnswer(${idx})" ${qSession.isAnswered ? 'disabled' : ''} 
                                        class="w-full text-left p-4.5 rounded-2xl border-2 transition flex items-center gap-4 ${btnStyle}">
                                        <span class="w-9 h-9 rounded-xl border flex items-center justify-center font-mono font-black text-xs shrink-0 ${badgeStyle}">${letters[idx]}</span>
                                        <span class="text-sm sm:text-base font-semibold">${opt}</span>
                                    </button>
                                `;
                            }).join('')}
                        </div>

                        ${qSession.isAnswered ? `
                            <div class="p-5 rounded-2xl border fade-in ${qSession.selectedAnswer === currentQ.answer ? 'bg-emerald-50/90 border-emerald-200 text-emerald-950' : 'bg-amber-50/90 border-amber-200 text-amber-950'}">
                                <div class="font-extrabold text-sm sm:text-base flex items-center gap-2 mb-1.5">
                                    <i class="fa-solid ${qSession.selectedAnswer === currentQ.answer ? 'fa-circle-check text-emerald-600' : 'fa-circle-xmark text-red-600'} text-lg"></i>
                                    ${qSession.selectedAnswer === currentQ.answer ? 'Jawaban Kamu Benar! (+10 XP)' : 'Kurang Tepat!'}
                                </div>
                                <p class="text-xs sm:text-sm leading-relaxed font-medium">${currentQ.explanation}</p>
                            </div>

                            <div class="flex justify-end pt-2">
                                <button onclick="nextQuizQuestion()" class="px-7 py-3.5 rounded-2xl bg-electric-500 hover:bg-electric-600 text-white font-extrabold text-sm shadow-lg shadow-blue-500/25 transition">
                                    ${qSession.currentIndex + 1 < total ? 'Soal Berikutnya' : 'Lihat Skor Level'} <i class="fa-solid fa-arrow-right ml-2"></i>
                                </button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function submitQuizAnswer(optIdx) {
            if (activeQuizSession.isAnswered) return;
            const currentQ = activeQuizSession.questions[activeQuizSession.currentIndex];
            const chosen = currentQ.shuffledOptions[optIdx];
            activeQuizSession.selectedAnswer = chosen;
            activeQuizSession.isAnswered = true;

            if (chosen === currentQ.answer) {
                activeQuizSession.correctCount++;
                addXP(10, 'Jawaban latihan benar');
            }
            renderQuizQuestion();
        }

        function nextQuizQuestion() {
            const qSession = activeQuizSession;
            if (qSession.currentIndex + 1 < qSession.questions.length) {
                qSession.currentIndex++;
                qSession.selectedAnswer = null;
                qSession.isAnswered = false;
                renderQuizQuestion();
            } else {
                finishQuizLevel();
            }
        }

        function finishQuizLevel() {
            const qSession = activeQuizSession;
            const total = qSession.questions.length;
            const score = Math.round((qSession.correctCount / total) * 100);
            const prevBest = appState.quizScores[qSession.level];

            if (prevBest === null || score > prevBest) {
                appState.quizScores[qSession.level] = score;
                saveState();
            }

            const container = document.getElementById('app-content');
            container.innerHTML = `
                <div class="max-w-xl mx-auto bg-white p-9 rounded-3xl border border-slate-200/80 shadow-xl text-center space-y-6 fade-in">
                    <div class="w-24 h-24 rounded-3xl mx-auto flex items-center justify-center text-5xl shadow-inner ${score >= 60 ? 'bg-emerald-100 text-emerald-600' : 'bg-amber-100 text-amber-600'}">
                        <i class="fa-solid ${score >= 60 ? 'fa-medal' : 'fa-rotate-right'}"></i>
                    </div>
                    <div>
                        <span class="text-xs font-mono uppercase tracking-wider text-electric-600 font-black">Latihan Level ${qSession.level} Selesai</span>
                        <h2 class="text-4xl font-black text-navy-900 mt-2">Skor: ${score}</h2>
                        <p class="text-sm text-slate-600 mt-2 font-medium">
                            Kamu menjawab benar <strong>${qSession.correctCount}</strong> dari <strong>${total}</strong> soal.
                        </p>
                    </div>
                    <div class="flex flex-wrap justify-center gap-3.5 pt-2">
                        <button onclick="startQuizLevel(${qSession.level})" class="px-6 py-3.5 rounded-2xl bg-slate-100 hover:bg-slate-200 text-navy-900 font-bold text-sm transition">
                            Ulangi Level ${qSession.level}
                        </button>
                        <button onclick="renderLatihan(document.getElementById('app-content'))" class="px-6 py-3.5 rounded-2xl bg-electric-500 hover:bg-electric-600 text-white font-extrabold text-sm shadow-md transition">
                            Pilih Level Lain
                        </button>
                    </div>
                </div>
            `;
        }

        // ==========================================
        // 9. EVALUASI AKHIR
        // ==========================================
        let evalSession = loadEvalSession();

        function loadEvalSession() {
            try {
                const raw = sessionStorage.getItem(EVAL_SESSION_KEY);
                return raw ? JSON.parse(raw) : null;
            } catch (e) {
                return null;
            }
        }

        function saveEvalSession() {
            try {
                if (evalSession) sessionStorage.setItem(EVAL_SESSION_KEY, JSON.stringify(evalSession));
                else sessionStorage.removeItem(EVAL_SESSION_KEY);
            } catch (e) {}
        }

        function renderEvaluasi(container) {
            if (appState.evaluationResult && !evalSession) {
                renderEvaluationReport(container, appState.evaluationResult);
                return;
            }

            if (!evalSession) {
                container.innerHTML = `
                    <div class="max-w-2xl mx-auto bg-white p-9 rounded-3xl border border-slate-200/80 shadow-sm text-center space-y-6">
                        <div class="w-20 h-20 rounded-3xl bg-amber-50 text-amber-500 flex items-center justify-center text-4xl mx-auto shadow-inner">
                            <i class="fa-solid fa-award"></i>
                        </div>
                        <div>
                            <span class="text-xs font-mono uppercase tracking-wider text-electric-600 font-black">Ujian Akhir Kompetensi</span>
                            <h1 class="text-3xl font-black text-navy-900 mt-2">Evaluasi Sistem Bilangan</h1>
                            <p class="text-sm text-slate-600 mt-2 leading-relaxed font-medium">
                                Evaluasi ini terdiri dari <strong>15 soal pilihan ganda</strong> (konsep, biner ke desimal, dan desimal ke biner).
                            </p>
                        </div>
                        <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200/70 text-left text-xs sm:text-sm text-slate-700 space-y-2.5 font-semibold">
                            <div class="flex items-center gap-3"><i class="fa-solid fa-check text-emerald-500 text-base"></i> Satu soal ditampilkan per halaman agar kamu fokus.</div>
                            <div class="flex items-center gap-3"><i class="fa-solid fa-check text-emerald-500 text-base"></i> Bebas berpindah antar nomor dan mengubah jawaban sebelum dikumpulkan.</div>
                            <div class="flex items-center gap-3"><i class="fa-solid fa-check text-emerald-500 text-base"></i> Rapor nilai lengkap dan pembahasan muncul otomatis setelah selesai.</div>
                        </div>
                        <button onclick="startEvaluation()" class="w-full sm:w-auto px-8 py-4 rounded-2xl bg-gradient-to-r from-electric-500 to-cyan-500 hover:from-electric-600 hover:to-cyan-600 text-white font-extrabold text-base shadow-xl shadow-blue-500/30 transition">
                            Mulai Evaluasi Sekarang <i class="fa-solid fa-arrow-right ml-2"></i>
                        </button>
                    </div>
                `;
                return;
            }

            renderEvaluationQuestionUI(container);
        }

        function startEvaluation() {
            evalSession = {
                questions: evaluationQuestions.map(q => ({
                    ...q,
                    shuffledOptions: shuffleArray(q.options)
                })),
                currentIndex: 0,
                userAnswers: {}
            };
            saveEvalSession();
            renderEvaluationQuestionUI(document.getElementById('app-content'));
        }

        function renderEvaluationQuestionUI(container) {
            const idx = evalSession.currentIndex;
            const q = evalSession.questions[idx];
            const total = evalSession.questions.length;
            const answeredCount = Object.keys(evalSession.userAnswers).length;
            const progressPct = Math.round((answeredCount / total) * 100);

            container.innerHTML = `
                <div class="max-w-4xl mx-auto space-y-6 fade-in">
                    <div class="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm space-y-4">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <span class="font-extrabold text-navy-900 text-sm">Soal Nomor <span class="text-electric-600 font-mono text-lg">${idx + 1}</span> dari ${total}</span>
                            <span class="text-xs font-mono text-slate-500 font-bold">Terjawab: <strong>${answeredCount}/${total}</strong> (${progressPct}%)</span>
                        </div>
                        <div class="w-full bg-slate-100 h-3 rounded-full overflow-hidden p-0.5 border border-slate-200">
                            <div class="bg-electric-500 h-full rounded-full transition-all duration-300 shadow-xs" style="width: ${progressPct}%"></div>
                        </div>
                        <div class="flex flex-wrap gap-2 pt-1">
                            ${evalSession.questions.map((_, i) => {
                                const isCurrent = i === idx;
                                const isAnswered = evalSession.userAnswers[i] !== undefined;
                                let cls = 'bg-slate-100 text-slate-600 hover:bg-slate-200';
                                if (isCurrent) cls = 'bg-navy-900 text-cyan-400 ring-2 ring-cyan-400';
                                else if (isAnswered) cls = 'bg-blue-100 text-electric-700 border border-blue-300';
                                return `<button onclick="jumpEvalQuestion(${i})" class="w-9 h-9 rounded-xl font-mono text-xs font-black transition shadow-xs ${cls}">${i + 1}</button>`;
                            }).join('')}
                        </div>
                    </div>

                    <div class="bg-white p-7 sm:p-9 rounded-3xl border border-slate-200/80 shadow-sm space-y-6">
                        <span class="inline-block text-xs font-extrabold uppercase tracking-wider bg-cyan-50 text-cyan-700 px-3.5 py-1.5 rounded-full border border-cyan-200">
                            Kategori: ${q.category}
                        </span>
                        <h2 class="text-xl sm:text-2xl font-black text-navy-900 leading-relaxed">${q.q}</h2>

                        <div class="space-y-3.5">
                            ${q.shuffledOptions.map((opt, optIdx) => {
                                const letters = ['A', 'B', 'C', 'D'];
                                const selected = evalSession.userAnswers[idx] === opt;
                                return `
                                    <button onclick="selectEvalOption(${idx}, ${optIdx})" 
                                        class="w-full text-left p-4.5 rounded-2xl border-2 transition flex items-center gap-4 ${selected ? 'bg-blue-50/80 border-electric-500 text-navy-900 font-bold shadow-sm' : 'bg-slate-50 hover:bg-slate-100 border-slate-200 text-slate-700'}">
                                        <span class="w-9 h-9 rounded-xl border flex items-center justify-center font-mono font-black text-xs shrink-0 ${selected ? 'bg-electric-500 border-electric-500 text-white shadow-sm' : 'bg-white border-slate-300 text-slate-500'}">${letters[optIdx]}</span>
                                        <span class="text-sm sm:text-base font-semibold">${opt}</span>
                                    </button>
                                `;
                            }).join('')}
                        </div>

                        <div class="pt-5 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3">
                            <button onclick="jumpEvalQuestion(${idx - 1})" ${idx === 0 ? 'disabled' : ''} class="px-5 py-3 rounded-2xl bg-slate-100 disabled:opacity-40 hover:bg-slate-200 text-slate-700 text-xs sm:text-sm font-bold transition">
                                <i class="fa-solid fa-chevron-left mr-1.5"></i> Sebelumnya
                            </button>

                            <div class="flex items-center gap-3">
                                ${idx < total - 1 ? `
                                    <button onclick="jumpEvalQuestion(${idx + 1})" class="px-6 py-3 rounded-2xl bg-electric-500 hover:bg-electric-600 text-white text-xs sm:text-sm font-extrabold transition shadow-md">
                                        Selanjutnya <i class="fa-solid fa-chevron-right ml-1.5"></i>
                                    </button>
                                ` : ''}
                                <button onclick="confirmFinishEvaluation()" class="px-6 py-3 rounded-2xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-black shadow-lg shadow-emerald-500/20 transition">
                                    <i class="fa-solid fa-paper-plane mr-1.5"></i> Selesaikan Evaluasi
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function selectEvalOption(qIdx, optIdx) {
            playTone('switch');
            evalSession.userAnswers[qIdx] = evalSession.questions[qIdx].shuffledOptions[optIdx];
            saveEvalSession();
            renderEvaluationQuestionUI(document.getElementById('app-content'));
        }

        function jumpEvalQuestion(targetIdx) {
            if (targetIdx >= 0 && targetIdx < evalSession.questions.length) {
                evalSession.currentIndex = targetIdx;
                saveEvalSession();
                renderEvaluationQuestionUI(document.getElementById('app-content'));
            }
        }

        function confirmFinishEvaluation() {
            const total = evalSession.questions.length;
            const answered = Object.keys(evalSession.userAnswers).length;
            const unanswered = total - answered;

            const msg = unanswered > 0
                ? `Masih ada ${unanswered} soal yang belum kamu jawab. Apakah kamu yakin ingin mengakhiri evaluasi sekarang?`
                : 'Semua 15 soal sudah terjawab. Apakah kamu yakin ingin mengumpulkan dan melihat hasil evaluasi?';

            openModal('Konfirmasi Selesaikan Evaluasi', msg, () => {
                calculateAndSaveEvaluation();
            });
        }

        function calculateAndSaveEvaluation() {
            let correct = 0;
            const reviewList = evalSession.questions.map((q, idx) => {
                const userAns = evalSession.userAnswers[idx] || null;
                const isCorrect = userAns === q.answer;
                if (isCorrect) correct++;
                return {
                    number: idx + 1,
                    category: q.category,
                    question: q.q,
                    userAnswer: userAns,
                    correctAnswer: q.answer,
                    isCorrect: isCorrect,
                    explanation: q.explanation
                };
            });

            const total = evalSession.questions.length;
            const wrong = total - correct;
            const percentage = Math.round((correct / total) * 100);
            const score = percentage;

            let predicate = 'Perlu Bimbingan';
            if (score >= 90) predicate = 'Sangat Baik (Istimewa)';
            else if (score >= 75) predicate = 'Baik (Kompeten)';
            else if (score >= 60) predicate = 'Cukup';

            const resultObj = {
                score, correct, wrong, percentage, predicate,
                date: new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' }),
                reviewList
            };

            const isFirstTime = !appState.evaluationResult;
            appState.evaluationResult = resultObj;
            evalSession = null;
            saveEvalSession();
            saveState();

            if (isFirstTime) addXP(100, 'Menyelesaikan Evaluasi Akhir BINARA!');
            renderEvaluationReport(document.getElementById('app-content'), resultObj);
        }

        function renderEvaluationReport(container, res) {
            container.innerHTML = `
                <div class="space-y-6 fade-in">
                    <div class="bg-gradient-to-br from-slate-950 via-navy-900 to-indigo-950 text-white p-7 sm:p-9 rounded-3xl shadow-2xl border border-slate-800">
                        <div class="flex flex-col md:flex-row items-center justify-between gap-6">
                            <div class="space-y-3 text-center md:text-left">
                                <span class="text-xs font-mono uppercase tracking-wider text-cyan-400 bg-cyan-400/15 px-3.5 py-1.5 rounded-full font-bold">Laporan Rapor Evaluasi BINARA</span>
                                <h1 class="text-2xl sm:text-3xl font-black">Predikat: <span class="text-cyan-400">${res.predicate}</span></h1>
                                <p class="text-xs sm:text-sm text-slate-300 font-medium">Nama Pelajar: <strong>${appState.studentName}</strong> &bull; ${res.date}</p>
                                <div class="pt-2 flex flex-wrap justify-center md:justify-start gap-3 no-print">
                                    <button onclick="window.print()" class="px-5 py-3 rounded-2xl bg-cyan-500 hover:bg-cyan-600 text-slate-950 font-black text-xs sm:text-sm transition shadow-md">
                                        <i class="fa-solid fa-print mr-1.5"></i> Cetak Rapor / PDF
                                    </button>
                                    <button onclick="startEvaluation()" class="px-5 py-3 rounded-2xl bg-electric-500 hover:bg-electric-600 text-white font-extrabold text-xs sm:text-sm transition shadow-md">
                                        <i class="fa-solid fa-rotate-right mr-1.5"></i> Ulangi Evaluasi
                                    </button>
                                </div>
                            </div>

                            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 w-full md:w-auto">
                                <div class="bg-slate-950/90 border border-cyan-500/40 p-4 rounded-2xl text-center shadow-inner">
                                    <span class="text-[11px] text-slate-400 block font-bold">Nilai Akhir</span>
                                    <strong class="text-3xl font-mono font-black text-cyan-400">${res.score}</strong>
                                </div>
                                <div class="bg-slate-950/90 border border-slate-800 p-4 rounded-2xl text-center shadow-inner">
                                    <span class="text-[11px] text-slate-400 block font-bold">Benar</span>
                                    <strong class="text-2xl font-mono font-black text-emerald-400">${res.correct}</strong>
                                </div>
                                <div class="bg-slate-950/90 border border-slate-800 p-4 rounded-2xl text-center shadow-inner">
                                    <span class="text-[11px] text-slate-400 block font-bold">Salah</span>
                                    <strong class="text-2xl font-mono font-black text-rose-400">${res.wrong}</strong>
                                </div>
                                <div class="bg-slate-950/90 border border-slate-800 p-4 rounded-2xl text-center shadow-inner">
                                    <span class="text-[11px] text-slate-400 block font-bold">Ketepatan</span>
                                    <strong class="text-2xl font-mono font-black text-white">${res.percentage}%</strong>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white p-7 rounded-3xl border border-slate-200/80 shadow-sm space-y-4">
                        <h2 class="text-xl font-black text-navy-900">Pembahasan Jawaban Evaluasi</h2>
                        <div class="space-y-4">
                            ${res.reviewList.map(item => `
                                <div class="p-5 rounded-2xl border ${item.isCorrect ? 'bg-emerald-50/50 border-emerald-200' : 'bg-rose-50/50 border-rose-200'}">
                                    <div class="flex items-start justify-between gap-2 mb-2">
                                        <span class="text-xs font-mono font-black px-3 py-1 rounded-xl ${item.isCorrect ? 'bg-emerald-100 text-emerald-900' : 'bg-rose-100 text-rose-900'}">
                                            Soal #${item.number} &bull; ${item.isCorrect ? 'Benar' : 'Salah'}
                                        </span>
                                        <span class="text-xs text-slate-500 font-bold">${item.category}</span>
                                    </div>
                                    <p class="text-sm sm:text-base font-extrabold text-navy-900 mb-2">${item.question}</p>
                                    <div class="text-xs sm:text-sm space-y-1 mb-3 font-medium">
                                        <div>Jawaban Kamu: <strong class="${item.isCorrect ? 'text-emerald-700' : 'text-rose-700'}">${item.userAnswer || 'Tidak dijawab'}</strong></div>
                                        ${!item.isCorrect ? `<div>Jawaban Benar: <strong class="text-emerald-700">${item.correctAnswer}</strong></div>` : ''}
                                    </div>
                                    <div class="bg-white/90 p-3.5 rounded-xl text-xs sm:text-sm text-slate-700 border border-slate-200/80 font-medium">
                                        <strong>Pembahasan:</strong> ${item.explanation}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // ==========================================
        // 10. PROFIL & BADGE
        // ==========================================
        function renderProfil(container) {
            const progress = calculateOverallProgress();
            const badges = getBadges();

            let motivation = 'Langkah awal yang hebat! Terus jelajahi modul materi BINARA.';
            if (progress >= 80) motivation = 'Luar biasa! Kamu sudah menguasai sistem bilangan biner dan desimal dengan sangat baik.';
            else if (progress >= 40) motivation = 'Progres yang mengesankan! Coba tantang dirimu di Level 3 Latihan Soal dan Evaluasi Akhir.';

            container.innerHTML = `
                <div class="space-y-6">
                    <div class="bg-white p-7 rounded-3xl border border-slate-200/80 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-6">
                        <div class="flex flex-col sm:flex-row items-center gap-5 text-center sm:text-left">
                            <div class="w-20 h-20 rounded-3xl bg-gradient-to-tr from-electric-500 to-cyan-400 text-navy-950 flex items-center justify-center text-4xl shadow-lg">
                                <i class="fa-solid fa-user-astronaut"></i>
                            </div>
                            <div>
                                <div class="flex items-center justify-center sm:justify-start gap-2.5">
                                    <h1 class="text-2xl font-black text-navy-900">${appState.studentName}</h1>
                                    <button onclick="editStudentName()" class="text-xs text-electric-600 hover:underline font-bold" title="Ubah Nama">
                                        <i class="fa-solid fa-pen"></i>
                                    </button>
                                </div>
                                <p class="text-xs text-slate-500 mt-0.5 font-medium">Murid SMP Kelas VIII &bull; Informatika</p>
                                <div class="mt-2.5 inline-flex items-center gap-2 bg-blue-50 text-electric-700 px-3.5 py-1.5 rounded-full text-xs font-black shadow-xs">
                                    <i class="fa-solid fa-bolt text-amber-500"></i> Total Poin: ${appState.xp} XP
                                </div>
                            </div>
                        </div>

                        <button onclick="confirmResetAllProgress()" class="px-5 py-3 rounded-2xl border border-rose-200 text-rose-600 hover:bg-rose-50 text-xs font-bold transition">
                            <i class="fa-solid fa-trash-can mr-1.5"></i> Reset Progres
                        </button>
                    </div>

                    <div class="bg-gradient-to-r from-navy-900 to-indigo-950 text-white p-6 rounded-3xl flex items-center gap-4 shadow-lg border border-slate-800">
                        <div class="w-12 h-12 rounded-2xl bg-cyan-400/20 text-cyan-400 flex items-center justify-center text-xl shrink-0">
                            <i class="fa-solid fa-quote-left"></i>
                        </div>
                        <p class="text-xs sm:text-sm text-slate-200 font-medium leading-relaxed">${motivation}</p>
                    </div>

                    <div class="bg-white p-7 rounded-3xl border border-slate-200/80 shadow-sm">
                        <h2 class="text-xl font-black text-navy-900 mb-5">Koleksi Badge Pencapaian</h2>
                        <div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-5">
                            ${badges.map(b => `
                                <div class="p-6 rounded-3xl border text-center transition interactive-card ${b.unlocked ? 'bg-white border-blue-200 shadow-md' : 'bg-slate-50 border-slate-200 opacity-60 grayscale'}">
                                    <div class="w-16 h-16 rounded-2xl mx-auto mb-4 bg-gradient-to-tr ${b.color} text-white flex items-center justify-center text-3xl shadow-lg">
                                        <i class="fa-solid ${b.icon}"></i>
                                    </div>
                                    <h3 class="font-extrabold text-base text-navy-900">${b.name}</h3>
                                    <p class="text-xs text-slate-500 mt-1.5 leading-relaxed font-medium">${b.desc}</p>
                                    <span class="inline-block mt-4 text-[11px] font-black uppercase tracking-wider px-3 py-1 rounded-full ${b.unlocked ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-200 text-slate-600'}">
                                        ${b.unlocked ? 'Terkumpul' : 'Terkunci'}
                                    </span>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="grid md:grid-cols-2 gap-6">
                        <div class="bg-white p-7 rounded-3xl border border-slate-200/80 shadow-sm">
                            <h3 class="font-extrabold text-navy-900 text-lg mb-4">Status Materi Pembelajaran</h3>
                            <div class="space-y-3">
                                ${materialsData.map(m => {
                                    const done = appState.completedMaterials.includes(m.id);
                                    return `
                                        <div class="flex items-center justify-between text-xs sm:text-sm p-3.5 rounded-2xl bg-slate-50 font-semibold">
                                            <span class="text-slate-700">Materi ${m.id}: ${m.title}</span>
                                            <span class="font-bold ${done ? 'text-emerald-600' : 'text-slate-400'}">
                                                ${done ? '<i class="fa-solid fa-circle-check mr-1.5"></i>Selesai' : 'Belum'}
                                            </span>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        <div class="bg-white p-7 rounded-3xl border border-slate-200/80 shadow-sm">
                            <h3 class="font-extrabold text-navy-900 text-lg mb-4">Riwayat Skor Latihan & Evaluasi</h3>
                            <div class="space-y-3.5">
                                ${[1, 2, 3].map(lvl => `
                                    <div class="flex items-center justify-between text-xs sm:text-sm p-3.5 rounded-2xl bg-slate-50 font-semibold">
                                        <span class="text-slate-700">Latihan Level ${lvl}</span>
                                        <span class="font-mono font-black text-electric-600">
                                            ${appState.quizScores[lvl] !== null ? appState.quizScores[lvl] + ' / 100' : '-'}
                                        </span>
                                    </div>
                                `).join('')}
                                <div class="flex items-center justify-between text-xs sm:text-sm p-3.5 rounded-2xl bg-blue-50 border border-blue-200 font-bold">
                                    <span class="text-navy-900">Evaluasi Akhir (15 Soal)</span>
                                    <span class="font-mono font-black text-electric-700">
                                        ${appState.evaluationResult ? appState.evaluationResult.score + ' / 100' : 'Belum Dikerjakan'}
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function editStudentName() {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-title').textContent = 'Ubah Nama Pelajar';
            document.getElementById('modal-message').innerHTML = `
                <label class="block text-xs font-bold text-slate-700 mb-2">Masukkan nama kamu:</label>
                <input type="text" id="new-student-name-input" value="${appState.studentName}" maxlength="30" class="w-full px-4 py-3 rounded-2xl border border-slate-300 text-navy-900 font-bold focus:border-electric-500 focus:outline-none">
            `;
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            document.getElementById('modal-cancel').onclick = closeModal;
            document.getElementById('modal-confirm').onclick = () => {
                const val = document.getElementById('new-student-name-input').value.trim();
                if (val) {
                    appState.studentName = val;
                    saveState();
                    renderProfil(document.getElementById('app-content'));
                    showToast('Nama berhasil diperbarui!', 'success');
                }
                closeModal();
            };
        }

        function confirmResetAllProgress() {
            openModal(
                'Reset Seluruh Progres?',
                'Semua poin XP, tanda selesai materi, skor latihan, dan hasil evaluasi akan dihapus dari perangkat ini. Lanjutkan?',
                () => {
                    appState = { ...defaultState };
                    saveState();
                    renderProfil(document.getElementById('app-content'));
                    showToast('Progres belajar berhasil direset.', 'info');
                }
            );
        }

        // ==========================================
        // 11. UTILITAS TOAST & MODAL
        // ==========================================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = {
                success: 'bg-navy-900 border-emerald-400 text-white',
                error: 'bg-rose-600 border-rose-400 text-white',
                info: 'bg-navy-900 border-cyan-400 text-white'
            };
            const icons = {
                success: 'fa-circle-check text-emerald-400 text-base',
                error: 'fa-circle-exclamation text-white text-base',
                info: 'fa-bolt text-cyan-400 text-base'
            };

            toast.className = `pointer-events-auto flex items-center gap-3 px-5 py-3.5 rounded-2xl border shadow-xl text-xs sm:text-sm font-bold fade-in ${colors[type]}`;
            toast.innerHTML = `<i class="fa-solid ${icons[type]}"></i><span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function openModal(title, message, onConfirm) {
            const modal = document.getElementById('custom-modal');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            document.getElementById('modal-cancel').onclick = closeModal;
            document.getElementById('modal-confirm').onclick = () => {
                closeModal();
                if (onConfirm) onConfirm();
            };
        }

        function closeModal() {
            const modal = document.getElementById('custom-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // Keyboard accessibility
        window.addEventListener('keydown', (e) => {
            if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

            const key = e.key.toUpperCase();
            const optMap = { 'A': 0, 'B': 1, 'C': 2, 'D': 3 };

            if (currentRoute === 'latihan' && activeQuizSession) {
                if (optMap[key] !== undefined && !activeQuizSession.isAnswered) {
                    submitQuizAnswer(optMap[key]);
                } else if ((e.key === 'Enter' || e.key === 'ArrowRight') && activeQuizSession.isAnswered) {
                    nextQuizQuestion();
                }
            }

            if (currentRoute === 'evaluasi' && evalSession) {
                if (optMap[key] !== undefined) {
                    selectEvalOption(evalSession.currentIndex, optMap[key]);
                } else if (e.key === 'ArrowRight') {
                    jumpEvalQuestion(evalSession.currentIndex + 1);
                } else if (e.key === 'ArrowLeft') {
                    jumpEvalQuestion(evalSession.currentIndex - 1);
                }
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            updateGlobalUI();
            navigateTo('beranda');
        });
    </script>
</body>
</html>
