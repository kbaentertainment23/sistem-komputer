    <script>
        // ==========================================
        // 0. EFEK SUARA INTERAKTIF (WEB AUDIO API)
        // ==========================================
        let soundEnabled = true;
        let audioCtx = null;

        function playTone(type) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;
                if (type === 'switch') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.exponentialRampToValueAtTime(780, now + 0.06);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
                    osc.start(now);
                    osc.stop(now + 0.06);
                } else if (type === 'correct') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.09); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.18); // G5
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
                    osc.start(now);
                    osc.stop(now + 0.32);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.linearRampToValueAtTime(160, now + 0.22);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
                    osc.start(now);
                    osc.stop(now + 0.22);
                }
            } catch (e) {}
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('sound-icon');
            const label = document.getElementById('sound-label');
            if (soundEnabled) {
                icon.className = 'fa-solid fa-volume-high text-electric-500 text-sm';
                label.textContent = 'Suara ON';
                playTone('switch');
            } else {
                icon.className = 'fa-solid fa-volume-xmark text-slate-400 text-sm';
                label.textContent = 'Suara OFF';
            }
        }

            dailyChallengeCompleted: false,
            lastActiveDate: new Date().toDateString()
        };

        let appState = loadState();
        let currentRoute = 'beranda';

        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    const today = new Date().toDateString();
                    if (parsed.lastActiveDate !== today) {
                        parsed.dailyChallengeCompleted = false;
                        parsed.lastActiveDate = today;
                    }
                    return { ...defaultState, ...parsed };
                }
            } catch (e) {}
            return { ...defaultState };
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
                updateGlobalUI();
            } catch (e) {}
        }

        function addXP(amount, reason) {
            appState.xp += amount;
            saveState();
            playTone('correct');
            showToast(`+${amount} XP: ${reason}`, 'success');

            const now = new Date();
            const seed = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();

            const targetBin = targetDec.toString(2);
            const distractor1 = targetDec + 2;
            const distractor2 = Math.max(1, targetDec - 3);
            const options = [targetDec, distractor1, distractor2].sort((a, b) => a - b);
            return { targetDec, targetBin, options };
        }

        function navigateTo(route, param = null) {
            currentRoute = route;
            const navMenu = document.getElementById('nav-menu');
            if (!navMenu.classList.contains('hidden') && window.innerWidth < 1024) {
                navMenu.classList.add('hidden');
            }

            document.querySelectorAll('.nav-item').forEach(btn => {
                if (btn.dataset.nav === route) {
                    btn.classList.add('bg-electric-500', 'text-white', 'shadow-lg', 'shadow-blue-500/30');
                    btn.classList.remove('text-slate-300', 'hover:bg-navy-800', 'hover:text-white');
                } else {
                    btn.classList.remove('bg-electric-500', 'text-white', 'shadow-lg', 'shadow-blue-500/30');
                    btn.classList.add('text-slate-300', 'hover:bg-navy-800', 'hover:text-white');
                }
            });

            const container = document.getElementById('app-content');
            container.innerHTML = '';
            container.classList.remove('fade-in');
            void container.offsetWidth;
            container.classList.add('fade-in');

            const topTitle = document.getElementById('topbar-title');
            const topSub = document.getElementById('topbar-subtitle');

            switch (route) {
                case 'beranda':
                    topTitle.textContent = 'Beranda Utama';
                    topSub.textContent = 'Media Pembelajaran Interaktif SMP';
                    renderBeranda(container);
                    break;
                case 'materi':
                    topTitle.textContent = 'Materi Belajar';
                    topSub.textContent = '6 Modul Terstruktur Biner & Desimal';
                    renderMateri(container, param || appState.lastMaterialId);
                    break;
                case 'lab':
                    topTitle.textContent = 'Lab Konversi';
                    topSub.textContent = 'Simulator Visual Biner & Desimal';
                    renderLabKonversi(container);
                    break;
                case 'latihan':
                    topTitle.textContent = 'Latihan Soal';
                    topSub.textContent = 'Tantangan Bertingkat (Pemula - Tantangan)';
                    renderLatihan(container, param);
                    break;
                case 'evaluasi':
                    topTitle.textContent = 'Evaluasi Akhir';
                    topSub.textContent = 'Uji Kompetensi 15 Soal Sistem Bilangan';
                    renderEvaluasi(container);
                    break;
                case 'profil':
                    topTitle.textContent = 'Profil & Badge';
                    topSub.textContent = 'Pencapaian, Badge, & Statistik Belajar';
                    renderProfil(container);
                    break;
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function calculateOverallProgress() {
            const matWeight = (appState.completedMaterials.length / 6) * 40;
            const completedQuizzes = Object.values(appState.quizScores).filter(s => s !== null && s >= 60).length;

            const evalWeight = appState.evaluationResult ? 30 : 0;
            return Math.round(matWeight + quizWeight + evalWeight);

        function verifyMiniCheck(matId, chosenIdx) {

            if (chosenIdx === mat.miniCheck.answerIndex) {

                saveState();
                renderMateri(document.getElementById('app-content'), matId);

                showToast('Belum tepat, coba baca kembali ringkasan di atas!', 'error');

        function markMaterialComplete(id) {
            if (!appState.verifiedMaterials.includes(id) && !appState.completedMaterials.includes(id)) {
                showToast('Jawab pertanyaan Mini-Cek Pemahaman di atas terlebih dahulu!', 'error');
                return;
            }
            if (!appState.completedMaterials.includes(id)) {
                appState.completedMaterials.push(id);
                addXP(25, `Menyelesaikan Materi ${id}`);
                renderMateri(document.getElementById('app-content'), id);
            } else {
                showToast('Materi ini sudah kamu tandai selesai.', 'info');
            }
        }

            if ((appState.verifiedMaterials.includes(id) || appState.completedMaterials.includes(id)) && !appState.completedMaterials.includes(id)) {
                appState.completedMaterials.push(id);
                addXP(25, `Menyelesaikan Materi ${id}`);

            const p = parseInt(str[1], 10);
            const s = parseInt(str[2], 10);

            const visual = document.getElementById('m2-visual-container');
            const formula = document.getElementById('m2-formula-box');
            if (!visual || !formula) return;

                    <div class="text-4xl font-mono font-black text-navy-900 my-2.5">${s}</div>

                </div>
            `;
            formula.innerHTML = `Penguraian Nilai: <span class="text-cyan-300">${r * 100} + ${p * 10} + ${s}</span> = <span class="font-extrabold text-white">${num}<sub>10</sub></span>`;

        let m3Bits = [0, 1, 0, 1];
        function renderM3Switches() {
            const grid = document.getElementById('m3-switches-grid');
            const readout = document.getElementById('m3-binary-readout');
            if (!grid) return;

            readout.textContent = m3Bits.join('');
            grid.innerHTML = m3Bits.map((bit, idx) => `
                <button onclick="toggleM3Switch(${idx})" class="bit-switch p-5 rounded-2xl border-2 flex flex-col items-center justify-center gap-2.5 transition ${bit === 1 ? 'bg-electric-500/20 border-cyan-400 shadow-lg shadow-cyan-500/20' : 'bg-navy-800 border-slate-700'}">
                    <div class="w-12 h-12 rounded-full flex items-center justify-center text-xl ${bit === 1 ? 'bg-cyan-400 text-navy-950 shadow-md shadow-cyan-400/50' : 'bg-slate-950 text-slate-500'}">
                        <i class="fa-solid fa-lightbulb"></i>
                    </div>
                    <span class="font-mono text-2xl font-black ${bit === 1 ? 'text-white' : 'text-slate-400'}">${bit}</span>
                    <span class="text-[11px] font-black uppercase tracking-wider ${bit === 1 ? 'text-cyan-300' : 'text-slate-500'}">${bit === 1 ? 'ON (Menyala)' : 'OFF (Mati)'}</span>
                </button>
            `).join('');
        }

        function toggleM3Switch(idx) {
            playTone('switch');
            m3Bits[idx] = m3Bits[idx] === 1 ? 0 : 1;

        }

        let m5CurrentStep = 1;

                },

                }

        let m6ShownCount = 0;

        function m6Control(action) {
            if (action === 'next' && m6ShownCount < m6StepsData.length) m6ShownCount++;
            else if (action === 'prev' && m6ShownCount > 0) m6ShownCount--;
            else if (action === 'reset') m6ShownCount = 1;

            const tbody = document.getElementById('m6-division-tbody');
            const banner = document.getElementById('m6-result-banner');
            if (!tbody || !banner) return;

            const visible = m6StepsData.slice(0, m6ShownCount);
            tbody.innerHTML = visible.map((row, idx) => `
                <tr class="border-b border-slate-200 ${idx === visible.length - 1 ? 'bg-blue-50/90 font-bold' : 'bg-white'}">
                    <td class="p-3.5 text-slate-500">#${row.step}</td>
                    <td class="p-3.5 text-navy-900">${row.op}</td>
                    <td class="p-3.5 text-slate-700">${row.quot}</td>
                    <td class="p-3.5">
                        <span class="inline-flex items-center justify-center w-8 h-8 rounded-xl bg-electric-500 text-white font-black shadow-sm">${row.rem}</span>
                        ${idx === 0 ? '<span class="text-[11px] font-sans text-slate-500 ml-2 font-medium">(Bit kanan)</span>' : ''}
                        ${row.step === 6 ? '<span class="text-[11px] font-sans text-cyan-600 font-bold ml-2">(Bit kiri)</span>' : ''}
                    </td>
                </tr>
            `).join('');

            if (m6ShownCount === m6StepsData.length) {
                banner.className = 'mt-6 p-5 rounded-2xl bg-navy-900 text-white text-center font-mono text-sm sm:text-base shadow-md border border-slate-800';
                banner.innerHTML = `Membaca sisa dari bawah ke atas: <span class="text-cyan-400 font-black text-lg">101101<sub>2</sub></span> &rarr; Jadi, <strong>45<sub>10</sub> = 101101<sub>2</sub></strong>`;
            } else {
                const currentBits = visible.map(v => v.rem).reverse().join('');
                banner.className = 'mt-6 p-5 rounded-2xl bg-slate-100 border border-slate-200 text-center font-mono text-xs sm:text-sm text-slate-700';
                banner.innerHTML = `Langkah ${m6ShownCount} dari 6 &bull; Bit terkumpul sementara: <strong class="text-electric-600">${currentBits || '-'}</strong>`;
            }
        }

        // ==========================================
        // 7. LAB KONVERSI INTERAKTIF
        // ==========================================
        let labBitWidth = 8;
        let labBits = [0, 0, 1, 0, 1, 1, 0, 1];
        let labChallengeTarget = null;
        let labDecInput = 45;
        let labDecSteps = [];
        let labDecVisibleStep = 0;

        function renderLabKonversi(container) {
            appState.labUsedCount++;
            saveState();

            container.innerHTML = `
                <div class="space-y-6">
                    <!-- Tab Switcher -->
                    <div class="bg-white p-2 rounded-3xl border border-slate-200/80 shadow-sm flex gap-2 max-w-md mx-auto">
                        <button onclick="switchLabTab('bin2dec')" id="lab-tab-bin2dec" class="flex-1 py-3 px-4 rounded-2xl font-extrabold text-xs sm:text-sm transition shadow-sm bg-electric-500 text-white">
                            <i class="fa-solid fa-arrow-right mr-1.5"></i> Biner &rarr; Desimal
                        </button>
                        <button onclick="switchLabTab('dec2bin')" id="lab-tab-dec2bin" class="flex-1 py-3 px-4 rounded-2xl font-extrabold text-xs sm:text-sm transition text-slate-600 hover:bg-slate-100">
                            <i class="fa-solid fa-arrow-left mr-1.5"></i> Desimal &rarr; Biner
                        </button>
                    </div>
                    <div id="lab-workspace"></div>
                </div>
            `;
            switchLabTab('bin2dec');
        }

        function switchLabTab(mode) {
            const btn1 = document.getElementById('lab-tab-bin2dec');
            const btn2 = document.getElementById('lab-tab-dec2bin');
            if (!btn1 || !btn2) return;

            if (mode === 'bin2dec') {
                btn1.className = 'flex-1 py-3 px-4 rounded-2xl font-extrabold text-xs sm:text-sm transition shadow-sm bg-electric-500 text-white';
                btn2.className = 'flex-1 py-3 px-4 rounded-2xl font-extrabold text-xs sm:text-sm transition text-slate-600 hover:bg-slate-100';
                renderLabBinToDec();
            } else {
                btn2.className = 'flex-1 py-3 px-4 rounded-2xl font-extrabold text-xs sm:text-sm transition shadow-sm bg-electric-500 text-white';
                btn1.className = 'flex-1 py-3 px-4 rounded-2xl font-extrabold text-xs sm:text-sm transition text-slate-600 hover:bg-slate-100';
                renderLabDecToBin();
            }
        }

        function renderLabBinToDec() {
            const ws = document.getElementById('lab-workspace');
            const weights = labBitWidth === 8
                ? [128, 64, 32, 16, 8, 4, 2, 1]
                : [32768, 16384, 8192, 4096, 2048, 1024, 512, 256, 128, 64, 32, 16, 8, 4, 2, 1];

            if (labBits.length !== labBitWidth) labBits = Array(labBitWidth).fill(0);
            const binaryStr = labBits.join('');
            
            let activeTerms = [];
            let totalDecimal = 0;
            labBits.forEach((bit, idx) => {
                if (bit === 1) {
                    activeTerms.push(weights[idx]);
                    totalDecimal += weights[idx];
                }
            });

            ws.innerHTML = `
                <div class="space-y-6 fade-in">
                    <div class="bg-blue-50/80 border border-blue-200 rounded-3xl p-5 flex flex-col lg:flex-row lg:items-center justify-between gap-4">

                        <div class="flex flex-wrap items-center gap-2.5 shrink-0">

                                <i class="fa-solid fa-expand mr-1.5"></i> ${labBitWidth === 8 ? 'Ubah ke 16-Bit' : 'Ubah ke 8-Bit'}

                            <button onclick="resetLabBits()" class="px-4 py-2.5 rounded-2xl bg-white border border-blue-200 hover:bg-blue-100 text-electric-600 text-xs font-bold transition">
